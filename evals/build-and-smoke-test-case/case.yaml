schema_version: "1.1"
name: build-and-smoke-test-case
context:
  scaffold_script: place-files.sh
expected_outcome: |
  A case directory under ./cases is generated from case.yaml with the skill's generator, a
  short smoke run (tens of iterations, coarse) of the full Allrun chain completes inside the
  OpenFOAM Docker image, the cell counts per region are checked against the generator's
  expected counts, and the response gives the exact command for the long run without
  starting it.
