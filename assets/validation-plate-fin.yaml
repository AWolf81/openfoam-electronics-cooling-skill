# Validation case: plate-fin heat sink in free convection, measured by calorimetry.
#
# Source: M. Kirinčić, T. Fadiga, B. Delač, "Experimental–Numerical Investigation of Natural
# Convection from a Plate Fin Heat Sink with Correlation Assessment", Thermo 2025, 5(4), 57,
# https://doi.org/10.3390/thermo5040057 (CC BY 4.0). Geometry from their Fig. 1, measurement from
# their Table 1 and Section 4.
#
# Measured: 9.22 W at base 50.0 °C, ambient 29.02 °C -> R = 2.28 K/W (their Fluent CFD: 2.22 K/W).
# Acceptance: the measurement's own uncertainty. Their Section 3.2 gives a combined standard
# uncertainty of 3.28 % on the heat flow (and so on R); the band is ±2u = ±6.6 %, R 2.13-2.43 K/W.
#
# The heat came from a water vessel pressed onto the whole base with silicone paste and insulated
# on every other side with 25 mm of expanded rubber foam (aluminium foil outside). Modelled as:
#   - a thin aluminium "vessel wall" (the board spreader) over the whole base that carries the
#     measured power itself (board.power_W, no devices);
#   - the 25 mm foam behind it (solids: vessel_insulation). Without it the heated vessel wall would
#     face open air and lose heat that in reality had to go through the sink;
#   - an adiabatic wall only behind the sink (back: {wall: footprint}); above, below and beside it
#     the back boundary is open, 30 mm behind the base. That is the paper's domain (their Sec. 5.1:
#     30 mm of air behind the base, the region behind the base excluded; Sec. 5.3: upper and lower
#     rear boundaries are pressure outlets, only the faces behind the base are adiabatic walls).
#
# Results (this skill): hand calc base 50.6 °C (R sink-air 2.34 K/W). CFD (default radiation rays
# [3, 4]) coarse: base 50.3 °C, R 2.308 K/W (+1.2 %); normal: base 50.4 °C, R 2.314 K/W (+1.5 %);
# all checks pass on both, including the domain energy balance. Compare the base temperature in
# the report ("Board and base temperature") with 50.0 °C. With the old odd ray count [3, 3] the
# horizontal low-emissivity faces absorbed radiation that does not exist and R came out 2.413 /
# 2.422 K/W (+5.8 / +6.2 %); a [3, 4] test on the coarse mesh in 01-09 had already given 2.308.
# Earlier model (back: wall over the whole 450 mm back boundary, 5 mm air gap behind the vessel
# wall, no foam): R 2.21 / 2.24 K/W (coarse / normal, -2.9 / -1.7 %). That agreement was flattered:
# 12-14 % of the heat left through the vessel wall's back face into the air gap, which is insulated
# in reality. Through the sink alone R is 2.48-2.49 K/W (this model) vs 2.55-2.58 K/W (whole wall).
#
#   python3 <skill>/scripts/hand_calc.py validation-plate-fin.yaml
#   python3 <skill>/scripts/make_case.py validation-plate-fin.yaml cases/plate-fin-coarse --resolution coarse
#   <skill>/scripts/of.sh cases/plate-fin-coarse ./Allrun          # about 10 min on 8 cores
#   python3 <skill>/scripts/report.py cases/plate-fin-coarse

name: validation-plate-fin-9W
ambient_C: 29.02               # paper Table 1

heatsink:
  width_mm: 123                # 11 fins x 3 mm + 10 gaps x 9 mm
  length_mm: 100               # vertical, along the fins
  base_mm: 6
  fin: {count: 11, thickness_mm: 3.0, height_mm: 30}
  k: 200                       # CHECK: alloy not stated in the paper (extruded 6063 ~200 W/mK)
  emissivity: 0.05             # bare aluminium, no surface treatment (paper: radiation <= 5 %)
  back: {wall: footprint}      # only the insulated vessel is behind the base; open room air
                               # above and below it. A wall over the whole back boundary (450 mm
                               # high) held the plume against it: no separate channel plumes.

board:
  label: water vessel wall
  size_mm: [123, 100]          # the whole base
  centre_mm: [61.5, 50]
  emissivity: 0.05             # vessel covered in aluminium foil
  layers_under_parts:
    - {name: contact, thickness_um: 10, k: 200}
  power_W: 9.22                # measured heat flow (calorimetry, 960 s steady period), put into
                               # the vessel wall: no devices, the board is the heat source
  spreader: {name: Al vessel wall, thickness_mm: 2, k: 200, rho: 2700, cp: 900}
  layers_to_sink:
    - {name: silicone paste, thickness_um: 50, k: 1.0}   # CHECK: not stated; adds only ~0.004 K/W

solids:
  - name: vessel_insulation    # 25 mm expanded rubber foam covered in aluminium foil (paper Sec. 3)
    y_mm: [0, 123]
    z_mm: [0, 100]
    height_mm: [0, 25]         # behind the vessel wall (x = -2 ... -27 mm)
    k: 0.036                   # CHECK: foam type not stated; elastomeric foam ~0.033-0.040 W/mK
    rho: 60
    cp: 1500
    emissivity: 0.05           # aluminium foil

airflow: {mode: free}

# Thermocouples (paper Sec. 3.1, Fig. 2; readings Table 1, K-type +-0.2 K). Conversion to the model
# frame (x out of the base, back face x = 0, fins x = 6...36 mm; y across the fins, fin i at
# y = 12 i ... 12 i + 3 mm; z up, sink bottom z = 0):
#   - "representative inner fin": Fig. 2a marks the second fin from the side -> fin 1, sampled
#     at its mid-thickness y = 13.5 mm (the temperature across a 3 mm Al fin is uniform to mK);
#   - TC1, TC2: mid-length (L = 50 mm -> z = 50), 1 and 15 mm from the base surface
#     (H -> x = 6 + H: 7 and 21 mm);
#   - TC3, TC4: 29 mm from the base surface (x = 35), 1 and 99 mm from the fin bottom (z = 1, 99);
#   - TCb: "at the junction between the vessel and the heat sink base"; Fig. 2a draws it at the top
#     edge of the base, mid-width; its depth is not dimensioned -> 0.5 mm inside the base, y = 61.5,
#     z = 90 (10 mm in from the top edge). In the CFD the contact face spans ~0.3 K bottom to top.
# The experiment held the base at 50.0 C and measured 9.22 W; this model puts in the 9.22 W, so
# its temperatures run ~1.4 K high (R +6 %). T - T(TCb) tests the temperature distribution on its
# own; the report gives both.
measurements:
  - {name: TCb, point_mm: [0.5, 61.5, 90], value_C: 50.0, uncertainty_K: 0.2, reference: true,
     note: base at the vessel junction}
  - {name: TC1, point_mm: [7, 13.5, 50], value_C: 49.8, uncertainty_K: 0.2, note: "fin 1, H 1 mm, L 50 mm"}
  - {name: TC2, point_mm: [21, 13.5, 50], value_C: 49.7, uncertainty_K: 0.2, note: "fin 1, H 15 mm, L 50 mm"}
  - {name: TC3, point_mm: [35, 13.5, 1], value_C: 49.4, uncertainty_K: 0.2, note: "fin 1, H 29 mm, L 1 mm"}
  - {name: TC4, point_mm: [35, 13.5, 99], value_C: 49.6, uncertainty_K: 0.2, note: "fin 1, H 29 mm, L 99 mm"}

mesh:
  resolution: coarse
  clearance_mm: {front: 100, back: 3, sides: 40, below: 100, above: 250}   # back: behind the
                               # foam, i.e. 30 mm behind the base as in the paper

solver:
  mode: steady
  iterations: 3000             # 9 W of free convection settles slowly; 1500 just missed the gate
  radiation: true
  n_procs: 8
